<!doctype html>
<html>
<head>
  <title>Peep Unblocker</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="https://github.com/RangerPeeps/PeepUnblocker/raw/gh-pages/assets/RangerPeeps%20Transparent.png">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: rgb(64, 64, 64);
      color: white;
      overflow: hidden;
    }

    #app-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    #header {
      background-color: rgb(64, 64, 64);
      display: flex;
      align-items: center;
      padding: 0.75em 1em;
      gap: 1em;
    }

    #logo {
      height: 50px;
    }

    h1 {
      margin: 0;
      color: rgb(252, 194, 3);
      font-size: 1.8em;
      text-transform: uppercase;
    }

    #controls {
      display: flex;
      align-items: center;
      gap: 0.5em;
      margin-left: auto;
    }

    #txtURL {
      width: 300px;
      height: 2em;
      padding: 0 1em;
      border-radius: 5px;
      border: none;
      font-size: 1em;
    }

    #btnGo {
      background-color: rgb(252, 194, 3);
      color: black;
      font-weight: bold;
      padding: 0.5em 1em;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    #btnGo:hover {
      background-color: rgb(255, 210, 40);
    }

    #warning {
      text-align: center;
      background: rgb(252, 194, 3);
      color: black;
      padding: 0.5em;
      display: none;
    }

    #main {
      flex-grow: 1;
      display: flex;
    }

    #sidebar {
      width: 220px;
      padding: 1em;
      overflow-y: auto;
      background-color: rgb(54, 54, 54);
      border-right: 2px solid rgb(252, 194, 3);
    }

    .section-title {
      font-weight: bold;
      margin-bottom: 0.5em;
      font-size: 1.1em;
      color: rgb(252, 194, 3);
    }

    .site-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75em;
    }

    .site-button {
      width: 80px;
      height: 80px;
      background-color: white;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .site-button img {
      width: 90%;
      height: 90%;
      object-fit: contain;
    }

    #viewer {
      flex-grow: 1;
      border: none;
      width: 100%;
    }
  </style>
</head>
<body>

  <div id="app-container">
    <div id="header">
      <img id="logo" src="https://github.com/RangerPeeps/PeepUnblocker/blob/gh-pages/assets/PeepGrey.jpg" alt="Logo">
      <h1>PEEP UNBLOCKER</h1>
      <div id="controls">
        <input id="txtURL" type="text" value="Enter Link">
        <button id="btnGo">Search</button>
      </div>
    </div>

    <div id="warning">Unfortunately google does not work with this unblocker, use "bing.com" instead!</div>

    <div id="main">
      <div id="sidebar">
        <div class="section-title">Popular Sites</div>
        <div class="site-buttons">
          <div class="site-button" onclick="navigate('youtube.com')">
            <img src="https://github.com/RangerPeeps/PeepUnblocker/raw/gh-pages/assets/youtubelogo.png" alt="YouTube">
          </div>
          <div class="site-button" onclick="navigate('reddit.com')">
            <img src="https://github.com/RangerPeeps/PeepUnblocker/raw/gh-pages/assets/reddit.png" alt="Reddit">
          </div>
          <div class="site-button" onclick="navigate('coolmathgames.com')">
            <img src="https://github.com/RangerPeeps/PeepUnblocker/raw/gh-pages/assets/coolmathgames.png" alt="CoolMathGames">
          </div>
          <div class="site-button" onclick="navigate('crazygames.com')">
            <img src="https://github.com/RangerPeeps/PeepUnblocker/raw/gh-pages/assets/crazygames.jpg" alt="CrazyGames">
          </div>
          <div class="site-button" onclick="navigate('spotify.com')">
            <img src="https://github.com/RangerPeeps/PeepUnblocker/raw/gh-pages/assets/spotify.png" alt="Spotify">
          </div>
          <div class="site-button" onclick="navigate('discord.com')">
            <img src="https://github.com/RangerPeeps/PeepUnblocker/raw/gh-pages/assets/discord.png" alt="Discord">
          </div>
          <div class="site-button" onclick="navigate('netflix.com')">
            <img src="https://github.com/RangerPeeps/PeepUnblocker/raw/gh-pages/assets/netflix.png" alt="Netflix">
          </div>
          <div class="site-button" onclick="navigate('1v1.lol')">
            <img src="https://github.com/RangerPeeps/PeepUnblocker/raw/gh-pages/assets/1v1-lol.jpg" alt="1v1.lol">
          </div>
        </div>
      </div>

      <iframe id="viewer" name="proxy-frame"></iframe>
    </div>
  </div>

  <script>
    const txtURL = document.getElementById("txtURL");
    const btnGo = document.getElementById("btnGo");
    const viewer = document.getElementById("viewer");
    const warning = document.getElementById("warning");

    let warningTimeout;

    function navigate(site) {
      txtURL.value = site;
      loadURL(site);
    }

    function loadURL(url) {
      if (/google/i.test(url)) {
        url = url.replace(/google/gi, 'bing');
        warning.style.display = 'block';
        clearTimeout(warningTimeout);
        warningTimeout = setTimeout(() => {
          warning.style.display = 'none';
        }, 3000);
      }
      viewer.src = './-----' + url;
    }

    btnGo.onclick = function () {
      const text = txtURL.value.trim();
      if (text) loadURL(text);
    };

    txtURL.onkeypress = function (e) {
      if (e.key === 'Enter') btnGo.click();
    };
  </script>

</body>
</html>
