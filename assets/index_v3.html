<!doctype html>
<html>
<head>
  <title>Peep Unblocker</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=0">
  <base target="_blank">
  <style>
    body {
      background-color: rgb(64, 64, 64);
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
    }

    h1 {
      color: rgb(252, 194, 3);
      margin-top: 2em;
      margin-bottom: 1em;
      font-size: 2em;
    }

    .input-container {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 1em;
      gap: 0.5em;
    }

    #txtURL {
      width: 300px;
      height: 2.5em;
      padding: 0 0.75em;
      border: none;
      border-radius: 6px;
      font-size: 1em;
    }

    #btnGo {
      background-color: rgb(252, 194, 3);
      border: none;
      padding: 0.7em 1.5em;
      border-radius: 6px;
      font-size: 1em;
      font-weight: bold;
      cursor: pointer;
      color: black;
    }

    #btnGo:hover {
      background-color: rgb(255, 210, 40);
    }
  </style>
</head>
<body>

  <h1>Peep Unblocker</h1>

  <div class="input-container">
    <input id="txtURL" type="text" value="youtube.com" autofocus>
    <button id="btnGo">Search</button>
  </div>

  <script>
    const btnGo = document.getElementById("btnGo");
    const txtURL = document.getElementById("txtURL");

    function rewriteGoogleToBing(url) {
      if (url.includes("google")) {
        return url.replace(/google/g, "bing");
      }
      return url;
    }

    btnGo.onclick = function() {
      const text = txtURL.value.trim();
      if (text) {
        let url = './-----' + text;
        url = rewriteGoogleToBing(url);
        open(url, '_blank', 'noopener,noreferrer');
      }
    };

    txtURL.onkeypress = function(e) {
      if (e.keyCode === 13) {
        btnGo.onclick();
      }
    };
  </script>

</body>
</html>
